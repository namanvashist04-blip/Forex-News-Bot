name: Forex News Bot Runner

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          if [ -f "Forex-News-Bot/requirements.txt" ]; then
            pip install -r Forex-News-Bot/requirements.txt
          else
            pip install -r requirements.txt
          fi

      - name: Run Bot Script (Single Run)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          RUN_MODE: cron
          TARGET_CURRENCIES: ${{ secrets.TARGET_CURRENCIES || 'USD,EUR,GBP,JPY,AUD,CAD,CHF,NZD' }}
        run: |
          if [ -d "Forex-News-Bot" ]; then
            cd Forex-News-Bot
          fi
          python bot.py

      - name: Commit and Push Database Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update SQLite database with sent alerts [skip ci]"
          file_pattern: "*.db **/*.db"
